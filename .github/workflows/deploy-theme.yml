name: Deploy Frizer Theme

on:
  push:
    branches:
      - develop
      - development
      - main
      - production
    paths:
      - 'wp-content/themes/frizer/**'
      - '.github/workflows/deploy-theme.yml'
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Where to deploy'
        required: true
        type: choice
        options:
          - Development
          - Production
      deploy_ref:
        description: 'Optional branch, tag, or commit SHA to deploy (leave empty for current ref)'
        required: false
        type: string
      dry_run:
        description: 'Preview changes without uploading files'
        required: true
        default: false
        type: boolean

concurrency:
  group: deploy-theme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-development:
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/development')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'Development')
    runs-on: ubuntu-latest
    environment: Development
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wp-content/themes/frizer/package-lock.json

      - name: Install theme dependencies
        working-directory: wp-content/themes/frizer
        run: npm ci

      - name: Build theme assets
        working-directory: wp-content/themes/frizer
        run: npm run build

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Preflight remote deploy checks
        run: |
          remote_parent_dir="$(dirname "${{ secrets.DEPLOY_PATH }}")"

          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set -eu
            command -v rsync >/dev/null 2>&1 || { echo 'rsync is not available on the remote server'; exit 1; }
            test -d '$remote_parent_dir' || { echo 'Deploy parent directory does not exist: $remote_parent_dir'; exit 1; }
            mkdir -p '${{ secrets.DEPLOY_PATH }}'
            test -w '${{ secrets.DEPLOY_PATH }}' || { echo 'Deploy path is not writable: ${{ secrets.DEPLOY_PATH }}'; exit 1; }
            echo 'Remote deploy checks passed for: ${{ secrets.DEPLOY_PATH }}'"

      - name: Generate deploy marker
        run: |
          cat > wp-content/themes/frizer/deploy-info.txt <<EOF
          environment=Development
          branch=${GITHUB_REF_NAME}
          deploy_ref=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_ref || github.ref_name }}
          commit_sha=${GITHUB_SHA}
          workflow=${GITHUB_WORKFLOW}
          run_number=${GITHUB_RUN_NUMBER}
          deployed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF

      - name: Deploy theme to development
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            dry_run_flags="--dry-run --itemize-changes"
            echo "Running development deploy in dry-run mode"
          else
            dry_run_flags=""
          fi

          rsync -az --delete --no-perms --no-owner --no-group \
            ${dry_run_flags} \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".ddev/" \
            --exclude "node_modules/" \
            --exclude "package.json" \
            --exclude "package-lock.json" \
            --exclude "webpack.config.js" \
            --exclude "src/js/" \
            --exclude "src/scss/" \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            "wp-content/themes/frizer/" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

  deploy-production:
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'Production')
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wp-content/themes/frizer/package-lock.json

      - name: Install theme dependencies
        working-directory: wp-content/themes/frizer
        run: npm ci

      - name: Build theme assets
        working-directory: wp-content/themes/frizer
        run: npm run build

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Preflight remote deploy checks
        run: |
          remote_parent_dir="$(dirname "${{ secrets.DEPLOY_PATH }}")"

          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set -eu
            command -v rsync >/dev/null 2>&1 || { echo 'rsync is not available on the remote server'; exit 1; }
            test -d '$remote_parent_dir' || { echo 'Deploy parent directory does not exist: $remote_parent_dir'; exit 1; }
            mkdir -p '${{ secrets.DEPLOY_PATH }}'
            test -w '${{ secrets.DEPLOY_PATH }}' || { echo 'Deploy path is not writable: ${{ secrets.DEPLOY_PATH }}'; exit 1; }
            echo 'Remote deploy checks passed for: ${{ secrets.DEPLOY_PATH }}'"

      - name: Generate deploy marker
        run: |
          cat > wp-content/themes/frizer/deploy-info.txt <<EOF
          environment=Production
          branch=${GITHUB_REF_NAME}
          deploy_ref=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_ref || github.ref_name }}
          commit_sha=${GITHUB_SHA}
          workflow=${GITHUB_WORKFLOW}
          run_number=${GITHUB_RUN_NUMBER}
          deployed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF

      - name: Deploy theme to production
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            dry_run_flags="--dry-run --itemize-changes"
            echo "Running production deploy in dry-run mode"
          else
            dry_run_flags=""
          fi

          rsync -az --delete --no-perms --no-owner --no-group \
            ${dry_run_flags} \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".ddev/" \
            --exclude "node_modules/" \
            --exclude "package.json" \
            --exclude "package-lock.json" \
            --exclude "webpack.config.js" \
            --exclude "src/js/" \
            --exclude "src/scss/" \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            "wp-content/themes/frizer/" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"